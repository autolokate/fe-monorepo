packages:
  - apps/*
  - '!apps/website-backup'
  - packages/*

# Dependency build-script policy (pnpm 11 `allowBuilds`; default-deny, strict).
# These packages require native/generated setup during a frozen install.
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
