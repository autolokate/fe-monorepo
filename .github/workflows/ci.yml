name: ci

on:
  pull_request:
  push:
    # Deliberately NOT `main`: a merge to main is already gated by the pull_request run above (branch
    # protection requires it green before merge) — re-running on the merge commit is redundant.
    # `staging` is the one push-triggered branch: it's also deploy-staging.yml's upstream gate via
    # workflow_run.
    branches: [staging]

# A superseding push/PR-update cancels the stale run instead of racing it to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # corepack (which resolves the pinned pnpm from package.json's `packageManager`) must be enabled
      # BEFORE setup-node's `cache: pnpm` runs, since that option shells out to `pnpm store path`.
      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Turbo's local cache, commit-scoped — repeat runs replay instead of recompiling.
      - name: Cache turbo build outputs
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Lint first (fast fail on style), then typecheck, then build (the heaviest gate).
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Build
        run: pnpm build

  # Hermetic functional gate — parallel to verify; no staging/prod secrets.
  # Website Vitest + QR FID + QR auth-otp-hermetic + QR purchase-hermetic + Admin hermetic
  # (ownership-transfer + garage commercial). Do not add live Admin/QR e2e here.
  #
  # Batch C CI change (2026-10-19):
  # - Added QR `test:auth-otp-hermetic` so OTP request/verify/refresh stay green without SMS.
  # - Admin runner broadened from ownership-only to `test:hermetic` (`*.hermetic.spec.ts`)
  #   so Garage commercial GET/PUT + pass grant + free-bid adjust regress under the same job.
  # Why: Batch C acceptance requires permanent QR/OTP + Admin garage CI gate; same Playwright
  # install/cache footprint — no new framework, no live credentials.
  test-hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # QR/Admin Vite hermetic servers resolve workspace packages via package.json
      # exports → dist/. Clean CI checkouts have no dist; verify builds them, but
      # this parallel job must build deps itself (matches apps/qr `predev`).
      - name: Build QR and Admin workspace dependencies
        run: |
          pnpm --filter "@autolokate/qr^..." build
          pnpm --filter "@autolokate/admin^..." build

      # QR resolves playwright@1.61.0; Admin resolves @playwright/test@1.61.1 — distinct
      # browser caches. Install Chromium (+ ubuntu system deps) for both trees.
      - name: Install Playwright Chromium
        run: |
          pnpm --filter @autolokate/qr exec playwright install --with-deps chromium
          pnpm --filter @autolokate/admin exec playwright install --with-deps chromium

      - name: Website Vitest
        run: pnpm --filter @autolokate/website test

      - name: QR FID Playwright
        run: pnpm --filter @autolokate/qr test:fid

      - name: QR auth-otp-hermetic Playwright
        run: pnpm --filter @autolokate/qr test:auth-otp-hermetic

      - name: QR purchase-hermetic Playwright
        run: pnpm --filter @autolokate/qr test:purchase-hermetic

      - name: Admin hermetic Playwright (ownership + garage)
        run: pnpm --filter @autolokate/admin test:hermetic
