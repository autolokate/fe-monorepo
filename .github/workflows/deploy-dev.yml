name: deploy-dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  CLUSTER: autolokate-cluster
  FRONTEND_SERVICE: autolokate-frontend-service
  FRONTEND_REPOSITORY: autolokate-frontend
  AWS_DEV_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
  AWS_DEV_ADMIN_BUCKET: ${{ vars.AWS_DEV_ADMIN_BUCKET }}
  AWS_DEV_QR_BUCKET: ${{ vars.AWS_DEV_QR_BUCKET }}
  AWS_DEV_ADMIN_DISTRIBUTION_ID: ${{ vars.AWS_DEV_ADMIN_DISTRIBUTION_ID }}
  AWS_DEV_QR_DISTRIBUTION_ID: ${{ vars.AWS_DEV_QR_DISTRIBUTION_ID }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify deployment configuration
        env:
          SITE_URL: ${{ vars.AWS_DEV_SITE_URL }}
          API_BASE_URL: ${{ vars.AWS_DEV_API_BASE_URL }}
        run: |
          if [[ -z "$AWS_DEV_DEPLOY_ROLE_ARN" ]]; then
            echo "::error::Set AWS_DEV_DEPLOY_ROLE_ARN to the Terraform github_dev_deployer_role_arn output."
            exit 1
          fi
          if [[ -z "$SITE_URL" || -z "$API_BASE_URL" ]]; then
            echo "::error::Set AWS_DEV_SITE_URL and AWS_DEV_API_BASE_URL repository Actions variables."
            exit 1
          fi
          if [[ -z "$AWS_DEV_ADMIN_BUCKET" || -z "$AWS_DEV_QR_BUCKET" ]]; then
            echo "::error::Set AWS_DEV_ADMIN_BUCKET and AWS_DEV_QR_BUCKET repository Actions variables."
            exit 1
          fi
          if [[ -z "$AWS_DEV_ADMIN_DISTRIBUTION_ID" || -z "$AWS_DEV_QR_DISTRIBUTION_ID" ]]; then
            echo "::error::Set AWS_DEV_ADMIN_DISTRIBUTION_ID and AWS_DEV_QR_DISTRIBUTION_ID repository Actions variables."
            exit 1
          fi

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm turbo build --filter=@autolokate/admin
        env:
          VITE_API_BASE_URL: ${{ vars.AWS_DEV_API_BASE_URL }}
          VITE_ENVIRONMENT: development
          VITE_ENABLE_LOGS: 'true'

      - name: Build QR
        run: pnpm turbo build --filter=@autolokate/qr
        env:
          VITE_API_BASE_URL: ${{ vars.AWS_DEV_API_BASE_URL }}
          VITE_ENVIRONMENT: development
          VITE_ENABLE_LOGS: 'true'
          VITE_RAZORPAY_KEY: ${{ vars.AWS_DEV_RAZORPAY_KEY_ID }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync admin to S3
        run: aws s3 sync apps/admin/dist "s3://${AWS_DEV_ADMIN_BUCKET}" --delete

      - name: Sync QR to S3
        run: aws s3 sync apps/qr/dist "s3://${AWS_DEV_QR_BUCKET}" --delete

      - name: Invalidate admin and QR CloudFront distributions
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$AWS_DEV_ADMIN_DISTRIBUTION_ID" \
            --paths '/*' \
            --region us-east-1
          aws cloudfront create-invalidation \
            --distribution-id "$AWS_DEV_QR_DISTRIBUTION_ID" \
            --paths '/*' \
            --region us-east-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.AWS_DEV_SITE_URL }}
            NEXT_PUBLIC_AUTOLOKATE_API_BASE_URL=${{ vars.AWS_DEV_API_BASE_URL }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.AWS_DEV_RAZORPAY_KEY_ID }}
          cache-from: type=gha,scope=dev-frontend
          cache-to: type=gha,mode=max,scope=dev-frontend

      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$FRONTEND_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$FRONTEND_SERVICE" \
            --region "$AWS_REGION"
